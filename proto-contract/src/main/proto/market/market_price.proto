syntax = "proto3";

package market;

option java_multiple_files = true;
option java_package = "com.swarang.market.grpc";
option java_outer_classname = "MarketPriceProto";
import "google/protobuf/empty.proto";

message MarketPrice{
  string ticker = 1;
  string price = 2;
  string timestamp = 3;
}

message MarketSubscription{
  string run_id = 1;
  repeated string tickers = 2;
}

message MarketUnsubscriptionRequest{
  string run_id = 1;
}

service MarketPriceStream{
  rpc StreamPrices(MarketSubscription) returns (stream MarketPrice);
  rpc Unsubscribe(MarketUnsubscriptionRequest) returns (google.protobuf.Empty);
}