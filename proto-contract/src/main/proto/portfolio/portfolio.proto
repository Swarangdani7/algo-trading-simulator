syntax = "proto3";

package portfolio;

option java_multiple_files = true;
option java_package = "com.swarang.portfolio.grpc";
option java_outer_classname = "PortfolioProto";
import "google/protobuf/empty.proto";
import "common/trade_decision.proto";

message PortfolioInitRequest{
  string userId = 1;
  repeated Allocation allocations = 2;
}

message Allocation{
  string ticker = 1;
  string amount = 2;
}

service PortfolioService{
  rpc ExecuteTrade(common.TradeDecision) returns (google.protobuf.Empty);
  rpc InitializePortfolio(PortfolioInitRequest) returns (google.protobuf.Empty);
}