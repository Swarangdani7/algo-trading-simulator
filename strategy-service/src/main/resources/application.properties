spring.application.name=strategy-service
server.port=8082

grpc.server.port=9091
grpc.server.enableKeepAlive=true
grpc.server.keepAliveTime=30s
grpc.server.keepAliveTimeout=10s
grpc.server.permitKeepAliveWithoutCalls=true

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka
eureka.client.webclient.enabled=true

strategy.rolling-window-size=5
strategy.warm-up-units=5
strategy.threshold=0.01

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s