spring.application.name=api-gateway
server.port=8080
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka

spring.cloud.gateway.server.webflux.routes[0].id=simulation-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://simulation-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/simulation/**

spring.cloud.gateway.server.webflux.routes[1].id=market-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://market-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/market/**

spring.cloud.gateway.server.webflux.routes[2].id=portfolio-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://portfolio-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/portfolio/**

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s